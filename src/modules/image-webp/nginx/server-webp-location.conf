# DT_WEBP_IMAGES
# Insert inside the target HTTPS server {}, before its fallback location /.
# Check regex location precedence on the target site.
location ~* ^/upload/(?:iblock|resize_cache)/.*\.(?:jpg|jpeg|png)$ {
    add_header Vary Accept always;
    # Add this explicitly if required: a location-level add_header overrides
    # inherited add_header directives (e.g. X-Robots-Tag on test VM).
    # add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    if (-f $request_filename$dt_webp_suffix) {
        rewrite ^ $uri.webp last;
    }
    try_files $uri =404;
}
location ~* ^/upload/(?:iblock|resize_cache)/.*\.webp$ {
    add_header Vary Accept always;
    # Same caveat for inherited headers.
    # add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
}
